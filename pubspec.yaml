  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_gen:
  output: lib/src/core/constant/generated
  line_length: 120
  integrations:
    flutter_svg: true
    rive: true
    lottie: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/png/logoo.png"