    - assets/icons/
    - assets/images/svg/
    - assets/images/png/
    - assets/images/webp/
    # - assets/lottie/
    # - assets/fonts/
    # - assets/fonts/GolosText/


  # An image asset can refer to one or more resolution-specific "variants", see
